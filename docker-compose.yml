services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: getitdone-postgres
    environment:
      POSTGRES_USER: getitdone
      POSTGRES_PASSWORD: getitdone
      POSTGRES_DB: getitdone
    ports:
      - "5432:5432"
    volumes:
      - getitdone-postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/db/migration_phase1_2.sql:/docker-entrypoint-initdb.d/02-migration_phase1_2.sql:ro
      - ./backend/src/db/migration_phase4.sql:/docker-entrypoint-initdb.d/03-migration_phase4.sql:ro
      - ./backend/src/db/migration_phase5.sql:/docker-entrypoint-initdb.d/04-migration_phase5.sql:ro
      - ./backend/src/db/migration_phase6.sql:/docker-entrypoint-initdb.d/05-migration_phase6.sql:ro
      - ./backend/src/db/migration_phase7.sql:/docker-entrypoint-initdb.d/06-migration_phase7.sql:ro
      - ./backend/src/db/migration_phase8_connected_system.sql:/docker-entrypoint-initdb.d/07-migration_phase8.sql:ro
      - ./backend/src/db/migration_phase9.sql:/docker-entrypoint-initdb.d/08-migration_phase9.sql:ro
      - ./backend/src/db/migration_phase10_missing_entities.sql:/docker-entrypoint-initdb.d/10-migration_phase10.sql:ro
      - ./backend/src/db/migration_phase11_financials.sql:/docker-entrypoint-initdb.d/11-migration_phase11.sql:ro
      - ./backend/src/db/migration_phase12_security_events.sql:/docker-entrypoint-initdb.d/12-migration_phase12.sql:ro
      - ./backend/src/db/migration_phase13_artwork.sql:/docker-entrypoint-initdb.d/13-migration_phase13.sql:ro
      - ./backend/src/db/migration_phase14_catalogue.sql:/docker-entrypoint-initdb.d/14-migration_phase14.sql:ro
      - ./backend/src/db/migration_phase15_service_detail.sql:/docker-entrypoint-initdb.d/15-migration_phase15.sql:ro
      - ./backend/src/db/migration_phase16_orders.sql:/docker-entrypoint-initdb.d/16-migration_phase16.sql:ro
      - ./backend/src/db/migration_phase17_time_pricing.sql:/docker-entrypoint-initdb.d/17-migration_phase17.sql:ro
      - ./backend/src/db/migration_phase18_admin_totp.sql:/docker-entrypoint-initdb.d/18-migration_phase18.sql:ro
      - ./backend/src/db/migration_phase19_catalogue_expansion.sql:/docker-entrypoint-initdb.d/19-migration_phase19.sql:ro
      - ./backend/src/db/migration_phase20_order_contact.sql:/docker-entrypoint-initdb.d/20-migration_phase20.sql:ro
      - ./backend/src/db/migration_phase21_skill_consolidation.sql:/docker-entrypoint-initdb.d/21-migration_phase21.sql:ro
      - ./backend/src/db/migration_phase22_totp_replay.sql:/docker-entrypoint-initdb.d/22-migration_phase22.sql:ro
      - ./backend/src/db/migration_phase23_booking_locality.sql:/docker-entrypoint-initdb.d/23-migration_phase23.sql:ro
      - ./backend/src/db/migration_phase24_booking_address.sql:/docker-entrypoint-initdb.d/24-migration_phase24.sql:ro
      - ./backend/src/db/migration_phase25_support_tickets.sql:/docker-entrypoint-initdb.d/25-migration_phase25.sql:ro
      - ./backend/src/db/migration_phase26_worker_app.sql:/docker-entrypoint-initdb.d/26-migration_phase26.sql:ro
      - ./backend/src/db/migration_phase27_training.sql:/docker-entrypoint-initdb.d/27-migration_phase27.sql:ro
      - ./backend/src/db/migration_phase28_zones.sql:/docker-entrypoint-initdb.d/28-migration_phase28.sql:ro
      - ./backend/src/db/migration_phase29_pricing_priority.sql:/docker-entrypoint-initdb.d/29-migration_phase29.sql:ro
      - ./backend/src/db/migration_phase30_territories.sql:/docker-entrypoint-initdb.d/30-migration_phase30.sql:ro
      - ./backend/src/db/migration_phase31_cooperative_status.sql:/docker-entrypoint-initdb.d/31-migration_phase31.sql:ro
      - ./backend/src/db/migration_admin_features.sql:/docker-entrypoint-initdb.d/32-migration_admin_features.sql:ro
      - ./backend/src/db/migration_chats.sql:/docker-entrypoint-initdb.d/33-migration_chats.sql:ro
      - ./backend/src/db/migration_roles.sql:/docker-entrypoint-initdb.d/34-migration_roles.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/35-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getitdone -d getitdone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: getitdone-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: getitdone-backend

    # Application config (Google client ids, SMS credentials, revenue split,
    # job tuning) comes from .env. Without this the container saw none of it —
    # compose reads .env for ${...} substitution but does not pass it through.
    # Anything under `environment:` below overrides the file, which is how the
    # container-network addresses beat .env's localhost ones.
    env_file:
      - .env

    environment:
      # This stack is a LOCAL DEVELOPMENT environment: trivial database
      # credentials, minioadmin/minioadmin, no TLS. It was labelled
      # production, which both misdescribed it and tripped the production
      # guards in config/env.ts. Override for a real deployment, where those
      # guards are exactly what you want.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000

      # Service names, not localhost — these must beat whatever .env says.
      DATABASE_URL: postgres://getitdone:getitdone@postgres:5432/getitdone
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8001

      # No default. A hardcoded fallback in a committed file means every
      # deployment that forgets to set it shares one publicly-known signing
      # secret, and every session token is forgeable.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ random characters)}

      STORAGE_DIR: /var/lib/getitdone/storage

      # Push notifications. Bind-mounted rather than baked into the image or
      # passed inline, so the key never enters an image layer or `docker inspect`.
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      STORAGE_PROVIDER: minio
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: getitdone
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"

    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_started
    restart: unless-stopped
    volumes:
      - getitdone-worker-storage:/var/lib/getitdone/storage
      - ./backend/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: getitdone-ai
    # Published, not just exposed: `expose` only reaches other compose services,
    # so a backend run on the host (npm run dev) could not reach the forecasting
    # engine and every /ai/* route returned 502.
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: getitdone-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  getitdone-postgres-data:
  getitdone-worker-storage:
  minio-data:

