# Continuous integration.
#
# Four independent jobs, one per deployable. They do NOT depend on each other:
# a Flutter analyzer failure should not hide a backend type error, and waiting
# for Postgres to boot should not delay the web build.
#
# Every job here runs a command that already existed and was only ever run by
# hand. Nothing new is being asked of the code — this just makes the answer
# visible on a pull request instead of on somebody's laptop.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. CI on a superseded commit
# is spend with no reader.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Integration tests talk to a real Postgres with PostGIS and a real Redis.
    # The matching engine is ST_DWithin and ST_Distance the whole way down, so a
    # stub database would test nothing that matters.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: getitdone
          POSTGRES_PASSWORD: getitdone
          POSTGRES_DB: getitdone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U getitdone"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://getitdone:getitdone@localhost:5432/getitdone_test
      REDIS_URL: redis://localhost:6379
      # Test-only. A real secret never appears in a workflow file.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JOBS_ENABLED: "false"
      WS_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Migrate
        run: npm run db:migrate
      - name: Test
        run: npm test

  web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      # `vite build` runs `tsc -b` first, so this covers the typecheck too.
      - name: Build
        run: npm run build

  mobile:
    name: Customer app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.4"
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated localisations are not committed, so they have to exist before
      # anything that imports AppLocalizations is analysed.
      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Goldens are rendered by the host's font stack and shift between
      # platforms. Upload the diffs so a failure is diagnosable from the run
      # page rather than only reproducible locally.
      - name: Upload golden diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: mobile/test/golden/failures/
          if-no-files-found: ignore
          retention-days: 7

  ai:
    name: AI sidecar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/requirements.txt

      - run: pip install -r requirements.txt
      - run: pip install ruff pytest httpx

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
