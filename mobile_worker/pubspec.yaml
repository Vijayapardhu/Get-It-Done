name: getitdone_worker
description: "GET IT DONE — the app the person doing the work holds."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The design system and the platform plumbing, shared with the customer app.
  # One token scale, one auth refresh queue. See packages/.
  gid_ui:
    path: ../packages/gid_ui
  gid_core:
    path: ../packages/gid_core

  cupertino_icons: ^1.0.8
  # The language and theme choices are read before the first frame, so they
  # live in the keystore alongside the tokens rather than in a second store.
  flutter_secure_storage: ^10.3.1
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  intl: ^0.20.2

  # Injectable time. The offer countdown is rendered against a server deadline
  # and a measured clock skew, and both of those need to be testable without
  # waiting 45 real seconds.
  clock: ^1.1.2

  # Opening Google Maps for navigation (an intent, not an SDK — see
  # WORKER_APP_PLAN 5.3), and dialling the customer.
  url_launcher: ^6.3.1

  geolocator: ^14.0.2
  google_maps_flutter: ^2.14.2

  # Remote push. The socket only exists while the app is foregrounded, and the
  # offer this app is built around arrives at a phone in a pocket.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  google_sign_in: ^6.2.1

  # The full-screen offer interrupt, drawn by the app from an FCM data message.
  flutter_local_notifications: ^20.1.0

  # The offline action queue. A worker in a lift must still be able to press
  # "Started"; the transition is written here first and drained later.
  sqflite: ^2.4.1
  path: ^1.9.0

  # What tells the queue it is worth trying again.
  connectivity_plus: ^6.1.0

  # The offer needs to be felt as well as heard: a phone in a pocket in a noisy
  # stairwell is a haptic problem, not an audio one.
  vibration: ^3.1.3

  # Foreground location service — keeps the pump alive when the app is
  # backgrounded on Android. Without this, Android kills the timer-based
  # location pump ~30s after the worker switches apps.
  flutter_foreground_task: ^8.0.0

  # Crash and performance monitoring. Non-negotiable for an app used by
  # people who will not file bug reports.
  firebase_crashlytics: ^4.0.0
  firebase_performance: ^0.10.0

  # ML Kit — document scanning (Aadhaar/PAN) and text recognition during
  # onboarding. Used in Phase 3 but declared here to batch pubspec changes.
  google_mlkit_document_scanner: ^0.3.0
  google_mlkit_text_recognition: ^0.14.0

  # Icon pack with filled and outline variants (Phosphor Icons)
  phosphor_flutter: ^2.1.0

  # Image picker for profile photo
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/brand/logo-icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#14285C"
  adaptive_icon_foreground: "assets/brand/logo-icon.png"
  web:
    generate: true
    image_path: "assets/brand/logo-icon.png"
    background_color: "#14285C"
    theme_color: "#2E5FD9"

flutter:
  generate: true
  uses-material-design: true

  # Bundled, not fetched. Same reasoning as the customer app: google_fonts
  # downloads on first launch, which is a hard network dependency for the
  # app's typeface on exactly the connections this audience has.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTelugu-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansTelugu-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansTelugu-700.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-700.ttf
          weight: 700

  assets:
    - assets/brand/
    - assets/lottie/
