name: gid_core
description: >-
  Platform plumbing shared by the customer and worker apps: the API client and
  its refresh queue, the typed models, token storage, the realtime socket, and
  configuration.

  The refresh queue is the reason this package exists. Access tokens are short
  and the backend rotates refresh tokens on use, so concurrent 401s must be
  serialised onto one shared refresh future. Writing that twice would faithfully
  reproduce the bug it was written to fix.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.1
  socket_io_client: ^3.1.6
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
