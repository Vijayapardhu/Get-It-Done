server {
    server_name fed.getitdone.vijayapardhu.tech;

    root /var/www/fed-getitdone;
    index index.html;

    # Proxy all API requests to backend
    location ~ ^/(admin|api|auth|workers|services|cooperatives|federations|analytics|ai|reports|support|notifications|zones|bookings|users|payments|settlements|refunds|files)/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/fed.getitdone.vijayapardhu.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fed.getitdone.vijayapardhu.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = fed.getitdone.vijayapardhu.tech) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name fed.getitdone.vijayapardhu.tech;
    return 404;
}
